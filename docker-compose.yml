x-postgres-base: &postgres-base
  image: postgres:17-alpine
  environment:
    POSTGRES_DB: ${DATABASE_NAME:-lottery}
    POSTGRES_USER: ${DATABASE_USER:-postgres}
    POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
  volumes:
    - lottery-postgres-data:/var/lib/postgresql/data
  networks:
    - lottery-network
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-lottery}']
    interval: 5s
    timeout: 5s
    retries: 5

services:
  postgres:
    <<: *postgres-base
    container_name: ${COMPOSE_PROJECT_NAME:-lottery}_postgres
    restart: unless-stopped
    ports:
      - '${LOTTERY_FORWARD_DB_PORT:-5432}:5432'

  lottery-app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    image: lottery-backend-production
    container_name: production_lottery-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/home/node/apps/logs
    environment:
      - DATABASE_HOST=postgres
      - LOG_PRETTY=false
    env_file:
      - .env
    ports:
      - '${LOTTERY_FORWARD_API_PORT:-3000}:${APP_PORT:-3000}'
    networks:
      - lottery-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:${APP_PORT:-3000}/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '20'

volumes:
  lottery-postgres-data:
    driver: local

networks:
  lottery-network:
    driver: bridge
