# Development override for backend service
# Used when: ./compose.sh dev api,... up -d

services:
  backend:
    build:
      context: apps/backend
      dockerfile: docker/dev.Dockerfile
    image: year-end-lottery-backend:dev
    container_name: year-end-lottery-backend-dev
    volumes:
      - ./apps/backend:/home/node/apps
      - lottery-node-modules:/home/node/apps/node_modules
      - lottery-pnpm-store:/home/node/.pnpm-store
    command: ["tail", "-f", "/dev/null"]

volumes:
  lottery-node-modules:
  lottery-pnpm-store:
