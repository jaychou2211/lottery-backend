services:
  nginx:
    build:
      context: apps/frontend
      dockerfile: docker/Dockerfile
    image: year-end-lottery-nginx:latest
    container_name: year-end-lottery-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - year-end-lottery-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '10'

networks:
  year-end-lottery-network:
