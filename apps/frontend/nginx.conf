# Year-End Lottery - Nginx Configuration
# Managed by deploy.sh - Do not edit year-end-party.conf directly

server {
    listen 80;
    listen [::]:80;
    server_name year-end-party.shepherdtech.group;

    root __FRONTEND_ROOT__;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # API proxy
    location /api/ {
        proxy_pass http://localhost:__API_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html - no cache (ensure users get latest version)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed assets - immutable long-term cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log __LOG_DIR__/year-end-party-access.log;
    error_log __LOG_DIR__/year-end-party-error.log;
}
