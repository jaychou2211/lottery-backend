services:
  lottery-app:
    build:
      context: .
      dockerfile: ./docker/dev.Dockerfile
    image: lottery-backend-dev
    container_name: dev_lottery-app
    volumes:
      - .:/home/node/apps
      - lottery-node-modules:/home/node/apps/node_modules
      - lottery-pnpm-store:/home/node/apps/.pnpm-store
      - ~/.gitconfig:/root/.gitconfig:ro
      - type: bind
        source: /run/host-services/ssh-auth.sock
        target: /ssh-agent
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
    env_file:
      - .env
    ports:
      - '${LOTTERY_FORWARD_API_PORT:-3000}:${APP_PORT:-3000}'
    networks:
      - lottery-network
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  lottery-node-modules:
    driver: local
  lottery-pnpm-store:
    driver: local

networks:
  lottery-network:
    driver: bridge
